# Production setup with Docker. Updates are by hand: `docker compose pull && docker compose up -d`.
# On the Steam Machine (rootless Podman) use deploy/steam-machine/install.sh instead: it runs the
# same image as a Podman Quadlet service and keeps it updated (Watchtower doesn't work there).
services:
  nicenovember:
    image: ghcr.io/sauce-2/nicenovember:latest
    env_file: .env
    volumes:
      - nicenovember-data:/data
    restart: always

volumes:
  nicenovember-data:
