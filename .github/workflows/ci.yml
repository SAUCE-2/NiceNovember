name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push cancels the older run, so an older commit's slower publish can't overwrite :latest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # No apt step: the runner image already has the clang, cmake and pkg-config whisper.cpp and
      # opus build with, and the Azure apt mirror sometimes crawls at a few kB/s for 20+ minutes.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  deploy-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck deploy/steam-machine/*.sh scripts/*.sh
      - run: deploy/steam-machine/test.sh
      - run: scripts/next-version.test.sh

  # PRs build the image without pushing it, so a broken Dockerfile fails here instead of on main.
  docker-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: nicenovember:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/check-portable.sh nicenovember:ci

  # Only main publishes an image; the Steam Machine's update timer pulls :latest. Each one is also
  # tagged with its semantic version, and the commit with a matching vX.Y.Z git tag.
  publish:
    needs: [test, deploy-script]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Image name and version
        run: |
          version=$(scripts/next-version.sh)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build, check it runs on CPUs without AVX-512, and only then push.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ env.VERSION }}
          labels: org.opencontainers.image.version=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/check-portable.sh "$IMAGE:latest"
      # The git tag goes last, so a version is only taken once its image is out.
      - run: docker push --all-tags "$IMAGE" && git push origin "HEAD:refs/tags/v$VERSION"
