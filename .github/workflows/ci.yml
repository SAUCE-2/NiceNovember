name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push cancels the older run, so an older commit's slower publish can't overwrite :latest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native deps (whisper.cpp, opus)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake clang libclang-dev pkg-config libopus-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  deploy-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck deploy/steam-machine/*.sh scripts/*.sh
      - run: deploy/steam-machine/test.sh

  # PRs build the image without pushing it, so a broken Dockerfile fails here instead of on main.
  docker-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: nicenovember:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user-static
      - run: scripts/check-portable.sh nicenovember:ci

  # Only main publishes an image; the Steam Machine's update timer pulls :latest.
  publish:
    needs: [test, deploy-script]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build, check it runs on CPUs without AVX-512, and only then push.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user-static
      - run: scripts/check-portable.sh "$IMAGE:latest"
      - run: docker push "$IMAGE:latest" && docker push "$IMAGE:${{ github.sha }}"
